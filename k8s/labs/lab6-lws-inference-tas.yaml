# k8s/labs/lab6-lws-inference-tas.yaml
# Multi-Pod Tensor-Parallel Distributed Inference with LeaderWorkerSet (LWS) & Cross-PodSet TAS
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: lws-tas-infer
  namespace: team-a
  labels:
    kueue.x-k8s.io/queue-name: team-a-queue
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 2
    leaderTemplate:
      metadata:
        annotations:
          kueue.x-k8s.io/podset-required-topology: "workshop.ai/topology-rack"
          kueue.x-k8s.io/podset-group-name: "lws-rack-group"
      spec:
        terminationGracePeriodSeconds: 2
        containers:
        - name: leader
          image: pytorch/torchserve:0.12.0-cpu
          command:
          - python3
          - /workspace/infer_server.py
          env:
          - name: RANK
            value: "0"
          - name: WORLD_SIZE
            value: "2"
          - name: MASTER_PORT
            value: "29500"
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          ports:
          - containerPort: 8080
            name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 2
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
          volumeMounts:
          - name: infer-script
            mountPath: /workspace
        volumes:
        - name: infer-script
          configMap:
            name: pytorch-lws-inference-script
    workerTemplate:
      metadata:
        annotations:
          kueue.x-k8s.io/podset-required-topology: "workshop.ai/topology-rack"
          kueue.x-k8s.io/podset-group-name: "lws-rack-group"
      spec:
        terminationGracePeriodSeconds: 2
        containers:
        - name: worker
          image: pytorch/torchserve:0.12.0-cpu
          command:
          - python3
          - /workspace/infer_server.py
          env:
          - name: RANK
            value: "1"
          - name: WORLD_SIZE
            value: "2"
          - name: MASTER_PORT
            value: "29500"
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
          volumeMounts:
          - name: infer-script
            mountPath: /workspace
        volumes:
        - name: infer-script
          configMap:
            name: pytorch-lws-inference-script
