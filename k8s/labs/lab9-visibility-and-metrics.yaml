# k8s/labs/lab9-visibility-and-metrics.yaml
# 1. Active Quota Occupier (5 vCPUs on-demand, EPOCHS=20 -> holds team-a-cq quota while we inspect queued workloads)
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: obs-occupier-job
  namespace: team-a
  labels:
    kueue.x-k8s.io/queue-name: team-a-queue
    kueue.x-k8s.io/priority-class: high-prod-priority
spec:
  replicatedJobs:
  - name: workers
    replicas: 1
    template:
      spec:
        parallelism: 2
        completions: 2
        template:
          metadata:
            annotations:
              kueue.x-k8s.io/podset-preferred-topology: "workshop.ai/topology-block"
          spec:
            terminationGracePeriodSeconds: 2
            restartPolicy: Never
            containers:
            - name: pytorch
              image: pytorch/torchserve:0.12.0-cpu
              command:
              - bash
              - -c
              - |
                exec torchrun \
                  --nnodes=2 \
                  --nproc_per_node=1 \
                  --node_rank=$JOB_COMPLETION_INDEX \
                  --master_addr=obs-occupier-job-workers-0-0.obs-occupier-job \
                  --master_port=29500 \
                  /workspace/train.py
              env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              - name: EPOCHS
                value: "20"
              resources:
                requests:
                  cpu: "2500m"
                  memory: "2Gi"
              volumeMounts:
              - name: script-vol
                mountPath: /workspace
            volumes:
            - name: script-vol
              configMap:
                name: pytorch-ddp-script
---
# 2. Queued Low-Priority Workload (Submitted FIRST among pending workloads, priority=100, 4 vCPUs)
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: obs-queued-low
  namespace: team-a
  labels:
    kueue.x-k8s.io/queue-name: team-a-queue
    kueue.x-k8s.io/priority-class: low-research-priority
spec:
  replicatedJobs:
  - name: workers
    replicas: 1
    template:
      spec:
        parallelism: 2
        completions: 2
        template:
          metadata:
            annotations:
              kueue.x-k8s.io/podset-preferred-topology: "workshop.ai/topology-block"
          spec:
            terminationGracePeriodSeconds: 2
            restartPolicy: Never
            containers:
            - name: pytorch
              image: pytorch/torchserve:0.12.0-cpu
              command: ["sleep", "60"]
              resources:
                requests:
                  cpu: "2000m"
                  memory: "2Gi"
---
# 3. Queued High-Priority Workload (Submitted SECOND among pending workloads, priority=1000, 4 vCPUs)
# Jumps ahead of 'obs-queued-low' to Position 0 in Kueue's Pending Queue!
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: obs-queued-high
  namespace: team-a
  labels:
    kueue.x-k8s.io/queue-name: team-a-queue
    kueue.x-k8s.io/priority-class: high-prod-priority
spec:
  replicatedJobs:
  - name: workers
    replicas: 1
    template:
      spec:
        parallelism: 2
        completions: 2
        template:
          metadata:
            annotations:
              kueue.x-k8s.io/podset-preferred-topology: "workshop.ai/topology-block"
          spec:
            terminationGracePeriodSeconds: 2
            restartPolicy: Never
            containers:
            - name: pytorch
              image: pytorch/torchserve:0.12.0-cpu
              command: ["sleep", "60"]
              resources:
                requests:
                  cpu: "2000m"
                  memory: "2Gi"
