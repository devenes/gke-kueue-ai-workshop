# k8s/labs/lab2-tas-rack.yaml
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: pytorch-tas-same-rack
  namespace: team-a
  labels:
    kueue.x-k8s.io/queue-name: team-a-queue
spec:
  replicatedJobs:
  - name: workers
    replicas: 1
    template:
      spec:
        parallelism: 2
        completions: 2
        template:
          metadata:
            annotations:
              # Forces both workers onto the exact same rack ('on-demand-rack-1' or 'on-demand-rack-2')
              kueue.x-k8s.io/podset-required-topology: "workshop.ai/topology-rack"
          spec:
            restartPolicy: Never
            containers:
            - name: pytorch
              image: pytorch/torchserve:0.12.0-cpu
              command:
              - bash
              - -c
              - |
                torchrun \
                  --nnodes=2 \
                  --nproc_per_node=1 \
                  --node_rank=$JOB_COMPLETION_INDEX \
                  --master_addr=pytorch-tas-same-rack-workers-0-0.pytorch-tas-same-rack \
                  --master_port=29500 \
                  /workspace/train.py
              env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              resources:
                requests:
                  cpu: "1200m"
                  memory: "2Gi"
              volumeMounts:
              - name: script-vol
                mountPath: /workspace
            volumes:
            - name: script-vol
              configMap:
                name: pytorch-ddp-script
