apiVersion: v1
kind: ConfigMap
metadata:
  name: pytorch-lws-inference-script
  namespace: team-a
data:
  infer_server.py: |
    import json
    import os
    import signal
    import socket
    import time
    from http.server import BaseHTTPRequestHandler, HTTPServer
    import torch
    import torch.nn as nn
    import torch.distributed as dist

    signal.signal(signal.SIGTERM, lambda *_: os._exit(0))

    def main():
        rank = int(os.environ.get("RANK", "0"))
        world_size = int(os.environ.get("WORLD_SIZE", "2"))
        master_addr = os.environ.get("LWS_LEADER_ADDRESS", "localhost")
        master_port = os.environ.get("MASTER_PORT", "29500")
        node_name = os.environ.get("NODE_NAME", socket.gethostname())

        os.environ["MASTER_ADDR"] = master_addr
        os.environ["MASTER_PORT"] = master_port
        os.environ["RANK"] = str(rank)
        os.environ["WORLD_SIZE"] = str(world_size)

        print(f"[LWS Rank {rank}/{world_size}] Connecting to Leader {master_addr}:{master_port} from Node: {node_name}", flush=True)
        dist.init_process_group(backend="gloo", rank=rank, world_size=world_size)
        print(f"[LWS Rank {rank}/{world_size}] Initialized Tensor-Parallel Shard on Node: {node_name}", flush=True)

        torch.manual_seed(42 + rank)
        shard_model = nn.Sequential(
            nn.Linear(512, 256),
            nn.GELU(),
            nn.Linear(256, 10)
        ).eval()

        def run_tp_step():
            t0 = time.perf_counter()
            x = torch.zeros(1, 512)
            if rank == 0:
                x = torch.randn(1, 512)
            dist.broadcast(x, src=0)
            with torch.no_grad():
                logits = shard_model(x)
            dist.all_reduce(logits, op=dist.ReduceOp.SUM)
            latency_ms = (time.perf_counter() - t0) * 1000.0
            pred_class = int(torch.argmax(logits, dim=-1).item())
            return latency_ms, pred_class, logits[0][:4].tolist()

        # Run 3 warmup Tensor-Parallel forward passes across Leader + Worker
        for step in range(1, 4):
            lat_ms, pred, sample_logits = run_tp_step()
            if rank == 0:
                print(f"[Warmup {step}/3] TP World Size: {world_size} | Node: {node_name} | AllReduce Latency: {lat_ms:.2f}ms | Pred: {pred}", flush=True)

        if rank == 0:
            class InferenceHandler(BaseHTTPRequestHandler):
                def do_GET(self):
                    if self.path == "/healthz":
                        self.send_response(200)
                        self.send_header("Content-Type", "application/json")
                        self.end_headers()
                        self.wfile.write(json.dumps({"status": "ok", "rank": rank, "node": node_name}).encode())
                        return

                    if self.path.startswith("/infer"):
                        cmd = torch.tensor([1], dtype=torch.int64)
                        dist.broadcast(cmd, src=0)
                        lat_ms, pred, sample_logits = run_tp_step()
                        payload = {
                            "model": "pytorch-tp-mlp-2shard",
                            "backend": "gloo",
                            "world_size": world_size,
                            "leader_node": node_name,
                            "predicted_class": pred,
                            "sample_logits": [round(v, 4) for v in sample_logits],
                            "all_reduce_latency_ms": round(lat_ms, 3)
                        }
                        print(f"[HTTP /infer] Distributed TP step completed in {lat_ms:.2f}ms -> Pred: {pred}", flush=True)
                        self.send_response(200)
                        self.send_header("Content-Type", "application/json")
                        self.end_headers()
                        self.wfile.write((json.dumps(payload) + "\n").encode())
                        return

                    self.send_response(404)
                    self.end_headers()

                def log_message(self, format, *args):
                    return

            server = HTTPServer(("0.0.0.0", 8080), InferenceHandler)
            print(f"[LWS Leader Rank 0] Listening on :8080 (/healthz, /infer) on Node: {node_name}", flush=True)
            server.serve_forever()
        else:
            print(f"[LWS Worker Rank {rank}] Entering Tensor-Parallel worker loop on Node: {node_name}", flush=True)
            while True:
                cmd = torch.tensor([0], dtype=torch.int64)
                dist.broadcast(cmd, src=0)
                if cmd.item() == 1:
                    lat_ms, pred, _ = run_tp_step()
                    print(f"[LWS Worker Rank {rank}] Participated in TP AllReduce ({lat_ms:.2f}ms) on Node: {node_name}", flush=True)

    if __name__ == "__main__":
        main()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pytorch-checkpoint-script
  namespace: team-a
data:
  train_checkpoint.py: |
    import os
    import signal
    import socket
    import sys
    import time
    import torch
    import torch.nn as nn
    import torch.optim as optim
    import torch.distributed as dist
    from torch.nn.parallel import DistributedDataParallel as DDP

    preempted_flag = False

    def handle_preemption(signum, frame):
        global preempted_flag
        preempted_flag = True

    signal.signal(signal.SIGTERM, handle_preemption)
    signal.signal(signal.SIGINT, handle_preemption)

    def save_checkpoint_atomic(ckpt_path, rank, epoch, model, optimizer):
        os.makedirs(os.path.dirname(ckpt_path), exist_ok=True)
        tmp_path = f"{ckpt_path}.rank{rank}.tmp"
        torch.save({
            "epoch": epoch,
            "model_state_dict": model.state_dict(),
            "optimizer_state_dict": optimizer.state_dict(),
        }, tmp_path)
        os.replace(tmp_path, ckpt_path)

    def main():
        dist.init_process_group(backend="gloo")
        rank = dist.get_rank()
        world_size = dist.get_world_size()
        node_name = os.environ.get("NODE_NAME", socket.gethostname())
        ckpt_path = os.environ.get("CHECKPOINT_PATH", "/var/tmp/kueue-checkpoints/lab7_ckpt.pt")
        epochs = int(os.environ.get("EPOCHS", "8"))

        print(f"[Rank {rank}/{world_size}] Initialized on Node: {node_name} | Checkpoint Path: {ckpt_path}", flush=True)

        torch.manual_seed(42)
        model = nn.Sequential(nn.Linear(512, 256), nn.ReLU(), nn.Linear(256, 10))
        optimizer = optim.SGD(model.parameters(), lr=0.01)

        loaded_epoch = 0
        if os.path.exists(ckpt_path):
            try:
                ckpt = torch.load(ckpt_path, map_location="cpu", weights_only=True)
                loaded_epoch = int(ckpt.get("epoch", 0))
                model.load_state_dict(ckpt["model_state_dict"])
                optimizer.load_state_dict(ckpt["optimizer_state_dict"])
            except Exception as exc:
                print(f"[Rank {rank}] Warning: Failed to read local checkpoint ({exc}), starting from 0", flush=True)
                loaded_epoch = 0

        local_epoch_tensor = torch.tensor([loaded_epoch], dtype=torch.int64)
        dist.all_reduce(local_epoch_tensor, op=dist.ReduceOp.MAX)
        synced_epoch = int(local_epoch_tensor.item())

        ddp_model = DDP(model)
        loss_fn = nn.CrossEntropyLoss()

        if rank == 0:
            if synced_epoch > 0:
                print(
                    f"🔄 [RESUMED FROM CHECKPOINT] Found saved state at Epoch {synced_epoch}! "
                    f"Resuming training from Epoch {synced_epoch + 1}/{epochs} (Zero Goodput Lost!)",
                    flush=True,
                )
            else:
                print(f"🆕 [FRESH START] No checkpoint found. Starting from Epoch 1/{epochs}", flush=True)

        last_completed_epoch = synced_epoch
        for epoch in range(synced_epoch + 1, epochs + 1):
            if preempted_flag:
                break

            optimizer.zero_grad()
            inputs = torch.randn(64, 512)
            labels = torch.randint(0, 10, (64,))
            outputs = ddp_model(inputs)
            loss = loss_fn(outputs, labels)
            loss.backward()
            optimizer.step()

            save_checkpoint_atomic(ckpt_path, rank, epoch, ddp_model.module, optimizer)
            last_completed_epoch = epoch

            if rank == 0:
                print(
                    f"Epoch [{epoch}/{epochs}] | World Size: {world_size} | Loss: {loss.item():.4f} "
                    f"| 💾 Checkpoint saved ({ckpt_path})",
                    flush=True,
                )

            for _ in range(8):
                if preempted_flag:
                    break
                time.sleep(0.5)

            if preempted_flag:
                break

        if preempted_flag:
            save_checkpoint_atomic(ckpt_path, rank, last_completed_epoch, ddp_model.module, optimizer)
            print(
                f"⚠️ [SIGTERM RECEIVED] [Rank {rank}] Kueue preemption detected! "
                f"Persisting checkpoint at Epoch {last_completed_epoch} to {ckpt_path} and exiting gracefully...",
                flush=True,
            )
            sys.stdout.flush()
            dist.destroy_process_group()
            sys.exit(0)

        if last_completed_epoch >= epochs:
            if os.path.exists(ckpt_path):
                try:
                    os.remove(ckpt_path)
                except OSError:
                    pass
            if rank == 0:
                print(f"🎉 Distributed Training Completed All {epochs} Epochs Successfully! (Cleaned up {ckpt_path})", flush=True)

        dist.destroy_process_group()

    if __name__ == "__main__":
        main()
