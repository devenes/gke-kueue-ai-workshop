apiVersion: v1
kind: ConfigMap
metadata:
  name: pytorch-ddp-script
  namespace: team-a
data:
  train.py: |
    import os
    import time
    import socket
    import torch
    import torch.nn as nn
    import torch.optim as optim
    import torch.distributed as dist
    from torch.nn.parallel import DistributedDataParallel as DDP

    def main():
        dist.init_process_group(backend="gloo")
        rank = dist.get_rank()
        world_size = dist.get_world_size()
        node_name = os.environ.get("NODE_NAME", socket.gethostname())
        print(f"[Rank {rank}/{world_size}] Initialized on Node: {node_name}", flush=True)

        model = nn.Sequential(nn.Linear(512, 256), nn.ReLU(), nn.Linear(256, 10))
        ddp_model = DDP(model)
        loss_fn = nn.CrossEntropyLoss()
        optimizer = optim.SGD(ddp_model.parameters(), lr=0.01)

        epochs = int(os.environ.get("EPOCHS", "6"))
        for epoch in range(1, epochs + 1):
            optimizer.zero_grad()
            inputs = torch.randn(64, 512)
            labels = torch.randint(0, 10, (64,))
            outputs = ddp_model(inputs)
            loss = loss_fn(outputs, labels)
            loss.backward()
            optimizer.step()
            if rank == 0:
                print(f"Epoch [{epoch}/{epochs}] | World Size: {world_size} | Loss: {loss.item():.4f}", flush=True)
            time.sleep(5)

        if rank == 0:
            print("Distributed Training Completed Successfully!", flush=True)
        dist.destroy_process_group()

    if __name__ == "__main__":
        main()
---
